seed: 42

data:
  root: data/Task02_Heart
  split_file: configs/splits.json
  n_test: 4
  n_folds: 4
  spacing: [1.25, 1.25, 2.7]
  patch_size: [96, 96, 96]

model:
  name: unet            # unet | segresnet
  out_channels: 2

train:
  max_epochs: 300
  batch_size: 2
  lr: 1.0e-3
  val_interval: 5
  amp: true

tracking:
  experiment: msd-heart

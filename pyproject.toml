[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medseg"
version = "0.1.0"
description = "Reproducible 3D medical image segmentation benchmark (MSD Task02 Heart)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    "monai[nibabel,tqdm]>=1.3",
    "numpy",
    "pandas",
    "scipy",
    "einops",
    "matplotlib",
    "hydra-core>=1.3",
    "mlflow>=2.10",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "pre-commit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]